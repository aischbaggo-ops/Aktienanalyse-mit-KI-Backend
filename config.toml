project_id = "lthzvefqwhyiynescyhq"

# Wird nur relevant, falls doch mal lokal mit "supabase start" / "functions
# serve" getestet wird (aktuell bewusst nicht genutzt, siehe README.md) - ohne
# diese Einstellung wuerde der lokale Edge-Runtime-Worker nach jeder Response
# sofort beendet, bevor EdgeRuntime.waitUntil() den Hintergrund-Task
# abschliessen kann. Fuer den echten Deploy gegen das Supabase-Projekt ist das
# ohne Wirkung - dort verifiziert Pruefpunkt 1 im README das reale Verhalten.
[edge_runtime]
policy = "per_worker"

# Pentest-Scratchpad L2 (2026-09-23): Kommentar korrigiert - stimmte nicht
# mehr. Beide Endpunkte verlangen laengst einen gueltigen Bearer-Token und
# lehnen ohne ihn mit 401 ab (verifyUser() in _shared/auth.ts, siehe
# Sicherheitsfix vom 18.9. in webhooks.ts). verify_jwt=false bedeutet hier
# NUR, dass die Supabase-API-Gateway-Ebene selbst KEINE eigene JWT-Pruefung
# vor dem Funktionsaufruf macht - die Function prueft den Token stattdessen
# selbst. WICHTIG bleibt: laut mehreren offenen supabase/cli-Issues wird
# diese Einstellung teils bei "functions deploy" nicht zuverlaessig
# uebernommen - nach jedem Deploy im Supabase Dashboard unter Edge
# Functions -> <function> -> Settings pruefen, dass "Enforce JWT
# Verification" tatsaechlich AUS ist, nicht nur hier im config.toml
# vertrauen.
[functions.analyse]
verify_jwt = false

[functions.symbol-search]
verify_jwt = false

# Muss wie analyse/symbol-search ohne Supabase-Auth-Header aufrufbar bleiben -
# genau die Faelle, die dieser Endpoint protokolliert (abgelaufener Passwort-
# Link, fehlgeschlagener Login), haben per Definition keine gueltige Session.
[functions.log-event]
verify_jwt = false
